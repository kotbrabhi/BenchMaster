previews:
  generation: manual

services:
  - type: web
    runtime: node
    name: benchmaster-api
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run prisma7:generate --workspace backend && npm run prisma8:emit --workspace backend && npm run build --workspace backend
    preDeployCommand: npx prisma7 migrate deploy --config backend/prisma7.config.ts && npm run db:bootstrap --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    runtime: static
    name: benchmaster-web
    plan: free
    buildCommand: npm install && CI=1 npm run build --workspace frontend
    staticPublishPath: frontend/dist/frontend/browser
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

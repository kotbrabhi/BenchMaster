previews:
  generation: manual

services:
  - type: web
    runtime: node
    name: benchmaster-api
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run prisma:generate --workspace backend && npm run build --workspace backend
    preDeployCommand: npx prisma db execute --schema backend/prisma/schema.prisma --file backend/prisma/migrations/202603221230_init/migration.sql && npm run db:bootstrap --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
    disk:
      name: benchmaster-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        value: file:/var/data/benchmaster.db
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    runtime: static
    name: benchmaster-web
    plan: free
    buildCommand: npm install && CI=1 npm run build --workspace frontend
    staticPublishPath: frontend/dist/frontend/browser
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

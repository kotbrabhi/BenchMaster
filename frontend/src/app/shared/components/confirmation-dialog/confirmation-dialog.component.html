@if (open) {
  <dialog
    #dialog
    class="confirmation-dialog"
    tabindex="-1"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (cancel)="handleCancel($event)"
    (click)="handleDialogClick($event)">
    <section class="confirmation-dialog__panel surface-card">
      <div class="confirmation-dialog__copy">
        @if (eyebrow) {
          <span class="confirmation-dialog__eyebrow">{{ eyebrow }}</span>
        }

        <h2 class="confirmation-dialog__title" [id]="titleId">{{ title }}</h2>
        <p class="confirmation-dialog__message">{{ message }}</p>

        @if (details) {
          <p class="confirmation-dialog__details">{{ details }}</p>
        }
      </div>

      <div class="confirmation-dialog__actions">
        <button
          #cancelButton
          class="button button--secondary"
          type="button"
          [disabled]="confirmBusy"
          (click)="cancelDialog()">
          {{ cancelLabel }}
        </button>
        <button
          class="button"
          [class.button--danger]="tone === 'danger'"
          type="button"
          [disabled]="confirmBusy || confirmPending"
          [attr.aria-busy]="confirmBusy || confirmPending"
          (click)="confirmDialog()">
          {{ confirmLabel }}
        </button>
      </div>
    </section>
  </dialog>
}

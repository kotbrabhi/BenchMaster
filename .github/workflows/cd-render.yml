name: CD Render

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: cd-render
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    env:
      RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}

    steps:
      - name: Check deploy hooks
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ] || [ -z "$RENDER_WEB_DEPLOY_HOOK_URL" ]; then
            echo "Missing Render deploy hook secrets."
            echo "Configure RENDER_API_DEPLOY_HOOK_URL and RENDER_WEB_DEPLOY_HOOK_URL in GitHub Actions secrets."
            exit 1
          fi

      - name: Trigger API deploy
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK_URL"

      - name: Trigger web deploy
        run: curl --fail --silent --show-error --request POST "$RENDER_WEB_DEPLOY_HOOK_URL"
